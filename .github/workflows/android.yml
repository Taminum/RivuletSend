name: Android build

# Build the Android APK in the cloud (the local machine stays free of the
# Android SDK/Gradle). Produces a debug APK artifact to sideload onto a real
# device for the Step 1 WebRTC/backpressure verification.
on:
  push:
    branches: [master]
    tags: ["v*"]
    paths:
      - "packages/android/**"
      - "packages/shared/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      # The android package was added without regenerating the root lockfile
      # locally (kept off the dev machine's disk), so don't require it frozen.
      - run: pnpm install --no-frozen-lockfile

      # The native android/ tree isn't committed — generate it from the pinned RN
      # template so it's canonical, then let autolinking pick up react-native-webrtc.
      - name: Generate native android project
        working-directory: packages/android
        run: |
          if [ ! -d android ]; then
            npx --yes @react-native-community/cli@15 init RivuletSend \
              --version 0.75.4 --directory /tmp/rs-native --skip-install --pm npm
            cp -r /tmp/rs-native/android ./android
          fi

      # No gradle-path patching needed: @react-native/gradle-plugin, codegen,
      # react-native and the community CLI are declared as direct deps of
      # @p2p/android, so pnpm symlinks them into packages/android/node_modules and
      # the RN template's default ../node_modules paths resolve as-is.

      # react-native-webrtc requires minSdk 24; the RN template defaults to 23.
      - name: Bump minSdk for react-native-webrtc
        working-directory: packages/android
        run: sed -i 's/minSdkVersion = 23/minSdkVersion = 24/' android/build.gradle

      # The QR scanner (react-native-camera-kit) needs the CAMERA permission; the
      # RN template manifest only declares INTERNET. Inject it right after.
      - name: Add CAMERA permission
        working-directory: packages/android
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.CAMERA' "$MANIFEST"; then
            sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />#' "$MANIFEST"
          fi
          grep permission "$MANIFEST"

      # Release, not debug: a debug APK loads its JS from a Metro dev server, so
      # it can't run standalone on a sideloaded phone ("Unable to load script").
      # Release bundles the JS into the APK; the RN template signs release with
      # the debug key, so it installs without a Play/release keystore.
      - name: Build release APK
        working-directory: packages/android/android
        run: ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: rivuletsend-apk
          path: packages/android/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
