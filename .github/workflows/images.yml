name: Publish images

# Build the server images in the cloud and push them to GHCR, so deployments
# only ever *pull* — no pnpm install / tsc / vite build on the VPS. Runs on
# every push to master (updates :latest) and on version tags (pins :vX.Y.Z).
on:
  push:
    branches: [master]
    tags: ["v*"]
    # Skip doc/desktop-only pushes that don't change any image input.
    paths:
      - "packages/web/**"
      - "packages/api/**"
      - "packages/signaling/**"
      - "packages/shared/**"
      - "Dockerfile.backend"
      - "pnpm-lock.yaml"
      - ".github/workflows/images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # api + signaling share one backend image (different run commands).
          - name: backend
            dockerfile: Dockerfile.backend
          - name: web
            dockerfile: packages/web/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action lowercases the image name (GHCR requires it) and derives
      # tags: :latest on the default branch, :vX.Y.Z on tags, plus :sha-<short>.
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/rivuletsend-${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Attestations reach out to the registry and slow the push with no
          # value for a self-hosted deploy.
          provenance: false
          # Cache layers between runs to keep rebuilds quick.
          cache-from: type=gha
          cache-to: type=gha,mode=max
